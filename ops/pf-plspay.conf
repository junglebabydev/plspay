# SEC-10 backstop: block LAN access to database, Supabase and Redis ports even if Docker binds 0.0.0.0.
# Install: sudo cp ops/pf-plspay.conf /etc/pf.anchors/plspay
#          add to /etc/pf.conf:  anchor "plspay"  and  load anchor "plspay" from "/etc/pf.anchors/plspay"
#          sudo pfctl -f /etc/pf.conf && sudo pfctl -e
block in quick proto tcp from ! 127.0.0.1 to any port { 3000 54321 54322 54323 54324 6379 }
