name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"   # Mondays 09:00 SGT

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scan (SEC-08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: Dependency audit (SEC-09)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3

  pocketbase-guard:
    name: The browser never talks to PocketBase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          fail=0
          # SPEC section 1: no public env vars, so no PocketBase URL can reach the browser bundle.
          if grep -rn "NEXT_PUBLIC_" src; then echo "NEXT_PUBLIC_ variable in src/"; fail=1; fi
          # CLAUDE.md rule 3: the app never signs in as a PocketBase superuser.
          if grep -rn "_superusers" src; then echo "superuser API referenced in src/"; fail=1; fi
          # No PocketBase client in client components.
          while IFS= read -r f; do
            if grep -n 'from "pocketbase"' "$f"; then echo "PocketBase imported in client component $f"; fail=1; fi
          done < <(grep -rl '"use client"' src)
          exit $fail
