name: CI
on:
  pull_request:
  push:
    branches: [main]   # Coolify deploys main on push; this checks what it deployed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit, traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test -- --reporter=verbose
      - run: npm run trace

  backend:
    name: Backend rule tests (PocketBase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/pocketbase
          key: pocketbase-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/pb-test.mjs') }}
      # The pinned PocketBase binary (sha256-checked), a fresh data dir, every migration from scratch,
      # then the access-rule, hook and route tests in tests/backend.
      - run: npm run test:db -- --reporter=verbose

  e2e:
    name: End-to-end
    needs: [check, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/pocketbase
          key: pocketbase-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/pb-test.mjs') }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e:pb   # throwaway PocketBase; global-setup seeds accounts and fixtures
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
